<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Minimal cyber defense logo</title>
  <desc id="desc">A dark blue shield with a turquoise circuit mark and gold node.</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="18" x2="286" y2="301" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="shield" x1="95" y1="69" x2="235" y2="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="320" rx="74" fill="url(#background)"/>
  <rect x="16" y="16" width="288" height="288" rx="60" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M160 54 244 87v66c0 56-34 91-84 116-50-25-84-60-84-116V87l84-33Z" fill="#0f1e33" stroke="url(#shield)" stroke-width="8" stroke-linejoin="round"/>
  <path d="M124 153h24v-27h24v27h24v27h-24v24h-24v-24h-24z" fill="url(#shield)" filter="url(#glow)"/>
  <path d="M160 126V94m0 110v24m-36-75H99m97 0h25" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="88" r="8" fill="#fbbf24"/><circle cx="160" cy="232" r="8" fill="#fbbf24"/><circle cx="93" cy="153" r="8" fill="#fbbf24"/><circle cx="227" cy="153" r="8" fill="#fbbf24"/>
</svg>
